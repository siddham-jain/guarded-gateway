name: gg

services:
  # GG_DEPLOY_* variables are read by compose only; the gateway ignores them
  gateway:
    image: ${GG_IMAGE:-gg-gateway:local}
    build:
      context: .
      args:
        GIT_SHA: ${GG_DEPLOY_GIT_SHA:-}
        BUILT_AT: ${GG_DEPLOY_BUILT_AT:-}
    env_file:
      - path: .env
        required: false
    # these win over .env, whose values point at localhost for running the gateway on the host
    environment:
      GG_REDIS_URL: redis://redis:6379/0
      GG_HOST: 0.0.0.0
      GG_PORT: "8000"
      GG_MODELS_DIR: /opt/gg/models
      GG_KEYS_FILE: /run/gg/keys.yaml
      GG_LANGFUSE__HOST: ${GG_DEPLOY_LANGFUSE_HOST:-http://langfuse-web:3000}
      OMP_NUM_THREADS: "2"
    ports:
      - "127.0.0.1:${GG_DEPLOY_PORT:-8000}:8000"
    volumes:
      - gg-models:/opt/gg/models
      - ${GG_DEPLOY_KEYS_FILE:-./config/keys.yaml}:/run/gg/keys.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # drain_s is 20 s; leave room for in-flight streams to finish
    stop_grace_period: 30s
    restart: unless-stopped

  # hosted demo only: `docker compose --profile hosted up -d`. tls for GG_PUBLIC_HOST via let's encrypt;
  # exposes /v1/*, /healthz, /readyz and /version. grafana, prometheus and langfuse stay on 127.0.0.1 (ssh tunnel).
  caddy:
    profiles: [hosted]
    image: caddy:2
    environment:
      GG_PUBLIC_HOST: ${GG_PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8
    # volatile-lru only evicts keys with a ttl, so budget and spend counters (no ttl) survive cache pressure
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${GG_REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GG_GRAFANA_ADMIN_PASSWORD:?set GG_GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gg-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # langfuse v4, only with `docker compose --profile langfuse up`; ui at http://localhost:3001.
  # its own postgres, clickhouse, redis and minio stay on the compose network; only the ui is published.
  # the project is created on first boot with the GG_LANGFUSE__* key pair the gateway sends traces with.
  langfuse-worker:
    profiles: [langfuse]
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-postgres}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-langfuseredis}
    restart: unless-stopped

  langfuse-web:
    profiles: [langfuse]
    image: docker.langfuse.com/langfuse/langfuse:4
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_INIT_ORG_ID: gg
      LANGFUSE_INIT_ORG_NAME: GG
      LANGFUSE_INIT_PROJECT_ID: gg-gateway
      LANGFUSE_INIT_PROJECT_NAME: gg-gateway
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${GG_LANGFUSE__PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${GG_LANGFUSE__SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: GG admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-}
    restart: unless-stopped

  langfuse-postgres:
    profiles: [langfuse]
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  langfuse-clickhouse:
    profiles: [langfuse]
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    restart: unless-stopped

  langfuse-redis:
    profiles: [langfuse]
    image: redis:8
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:-langfuseredis}", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:-langfuseredis}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  langfuse-minio:
    profiles: [langfuse]
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    # creates the langfuse bucket before the server starts
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-miniosecret}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    restart: unless-stopped

volumes:
  gg-models:
  caddy-data:
  caddy-config:
  redis-data:
  prom-data:
  grafana-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
