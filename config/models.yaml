# canonical open-weight models served by several hosts; each host becomes deployment `<provider>/<model id>`.
# selection: price orders hosts by current list price; order keeps the listed order.
# host choice never changes the model class, so these may sit inside one tier group.
models:
  openai/gpt-oss-120b:
    hf_repo: openai/gpt-oss-120b
    native_precision: mxfp4
    capabilities: *gpt_oss
    defaults: {reasoning_effort: low, max_completion_tokens: 4096}
    selection: price
    hosts:
      - provider: deepinfra
        upstream_model: openai/gpt-oss-120b
        quantization: bf16
        pricing: [{effective_from: 2026-10-01, input: 0.037, output: 0.17}]
      - provider: groq
        upstream_model: openai/gpt-oss-120b
        capabilities: {json_schema: false, json_object: false}   # structured outputs do not stream on groq
        billing: free_tier
        pricing: [{effective_from: 2026-10-01, input: 0.15, cached_input: 0.075, output: 0.60}]
      - provider: fireworks
        upstream_model: gpt-oss-120b
        pricing: [{effective_from: 2026-10-01, input: 0.15, cached_input: 0.015, output: 0.60}]
      - provider: together
        upstream_model: openai/gpt-oss-120b
        pricing: [{effective_from: 2026-10-01, input: 0.15, output: 0.60}]
      - provider: cerebras
        upstream_model: gpt-oss-120b
        quantization: fp8
        capabilities: {json_schema: false, json_object: false}   # no json_object with stream, no tools + response_format
        pricing: [{effective_from: 2026-10-01, input: 0.35, output: 0.75}]
  openai/gpt-oss-20b:
    hf_repo: openai/gpt-oss-20b
    native_precision: mxfp4
    capabilities: *gpt_oss
    defaults: {reasoning_effort: low, max_completion_tokens: 4096}
    selection: price
    hosts:
      - provider: deepinfra
        upstream_model: openai/gpt-oss-20b
        pricing: [{effective_from: 2026-10-01, input: 0.03, output: 0.14}]
      - provider: groq
        upstream_model: openai/gpt-oss-20b
        capabilities: {json_schema: false, json_object: false}
        billing: free_tier
        pricing: [{effective_from: 2026-10-01, input: 0.075, output: 0.30}]

groups:                                      # ordered fallback chains; quality class never changes inside a group
  weak:
    chain: [openai/gpt-6-luna, anthropic/claude-haiku-4-5, gemini/gemini-3.1-flash-lite, openai/gpt-oss-120b,
            "ollama/llama3.2:1b"]
  strong:
    chain: [openai/gpt-6.1-sol, anthropic/claude-sonnet-5-5, gemini/gemini-3.1-pro-preview]
    chain_with_tools: [openai/gpt-6-sol, anthropic/claude-sonnet-5-5, gemini/gemini-3.1-pro-preview]
  premium:
    chain: [anthropic/claude-opus-5-5]
  resilient:                                 # handout fallback demo; ollama only when enabled
    chain: [openai/gpt-6-luna, anthropic/claude-haiku-4-5, "ollama/llama3.2:1b"]
  weak-open:
    chain: [openai/gpt-oss-120b]
  weak-labs:
    chain: [deepseek/deepseek-flash, zai/glm-5.3-flash, qwen/qwen3.8-flash]
  weak-anthropic: {chain: [anthropic/claude-haiku-4-5]}
  strong-anthropic: {chain: [anthropic/claude-sonnet-5-5]}
  demo-chaos: {chain: [mock/down, mock/echo]}
  coding-plans:                              # subscription upstreams; falls through to paid labs when quota is spent
    chain: [zai_coding/glm-5, qwen_coding/qwen3.7-plus, minimax_coding/MiniMax-M2.7, deepseek/deepseek-flash]

aliases:
  gg/auto: {router: true, groups: [weak, strong]}
  gg/weak: {group: weak}
  gg/strong: {group: strong}
  gg/premium: {group: premium}
  gg/resilient: {group: resilient}
  gg/weak-open: {group: weak-open}
  gg/weak-labs: {group: weak-labs}
  gg/demo-chaos: {group: demo-chaos}
  gg/coding-plans: {group: coding-plans}
bare_names: true

profiles:
  prod: {}
  dev-free:                                  # free tiers first
    groups:
      weak: {chain: [gemini/gemini-3.1-flash-lite, groq/openai/gpt-oss-120b, zai/glm-4.7-flash, openai/gpt-6-luna,
                     "ollama/llama3.2:1b"]}
      strong: {chain: [gemini/gemini-3.8-flash, openai/gpt-6.1-sol, anthropic/claude-sonnet-5-5],
               chain_with_tools: [gemini/gemini-3.8-flash, openai/gpt-6-sol, anthropic/claude-sonnet-5-5]}
  ci:
    only_providers: [mock]
    groups:
      weak: {chain: [mock/echo]}
      strong: {chain: [mock/echo], chain_with_tools: [mock/echo]}
      premium: {chain: [mock/echo]}
      resilient: {chain: [mock/flaky, mock/echo]}
  loadtest:
    only_providers: [mock_http]
    groups:
      weak: {chain: [mock_http/gpt-mock]}
      strong: {chain: [mock_http/gpt-mock], chain_with_tools: [mock_http/gpt-mock]}
  demo:                                      # hosted demo: free tiers first; gg/demo-chaos falls over from a 529 mock
    groups:
      weak: {chain: [gemini/gemini-3.1-flash-lite, groq/openai/gpt-oss-120b, zai/glm-4.7-flash, openai/gpt-6-luna]}
      strong: {chain: [gemini/gemini-3.8-flash, openai/gpt-6.1-sol, anthropic/claude-sonnet-5-5],
               chain_with_tools: [gemini/gemini-3.8-flash, openai/gpt-6-sol, anthropic/claude-sonnet-5-5]}
      demo-chaos: {chain: [mock/down, gemini/gemini-3.1-flash-lite, mock/echo]}
