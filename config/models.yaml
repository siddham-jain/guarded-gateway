    defaults: {temperature: 0.6, max_completion_tokens: 512}
    pricing: [{effective_from: 2024-01-01, input: 0, cached_input: 0, output: 0}]

  # --- mock
  - id: mock/echo
    capabilities: *openai_reasoning
    defaults: {mock: {text: echo}}
    pricing: [{effective_from: 2024-01-01, input: 1.00, cached_input: 0.10, output: 2.00}]   # non-zero to exercise C9
  - id: mock/flaky                           # fails the first attempt of every request with a 529, then serves
