    pricing: [{effective_from: 2024-01-01, input: 1.00, cached_input: 0.10, output: 2.00}]

  # --- openrouter (paid credit; prices checked against openrouter.ai/api/v1/models on 2026-10-08)
  - id: openrouter/openai/gpt-6-luna
