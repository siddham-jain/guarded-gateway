    defaults: {mock: {text: echo, fail: {status: 529, first_n_attempts: 1}}}
    pricing: [{effective_from: 2024-01-01, input: 1.00, cached_input: 0.10, output: 2.00}]
  - id: mock/down                            # always answers 529, so a chain must fall over to the next deployment
    capabilities: *openai_reasoning
    defaults: {mock: {text: echo, fail: {status: 529}}}
    pricing: [{effective_from: 2024-01-01, input: 1.00, cached_input: 0.10, output: 2.00}]
