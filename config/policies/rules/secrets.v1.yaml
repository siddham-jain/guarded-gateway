# secret rules, a curated subset inspired by gitleaks (MIT) rule designs; patterns are our own.
# examples use {{fake:...}} templates expanded at test time, so no key-shaped literal lives in the repo.
# every rule needs at least one match and one no_match example (tests/unit/guardrails/test_rule_packs.py).
id: secrets
version: 1.0.0
engine: re
keyword_window: 40
allow_substrings: ["EXAMPLE", "example", "YOUR_", "your_", "XXXXXXXX", "xxxxxxxx", "REDACTED"]
entropy_keywords:
  [api_key, apikey, api-key, secret, token, password, passwd, pwd, credential, bearer, private_key, access_key]
rules:
  - id: aws_access_key_id
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b'
    examples:
      match: ["export AWS_ACCESS_KEY_ID={{fake:aws_access_key}}"]
      no_match: ["the docs use AKIAIOSFODNN7EXAMPLE as a sample", "AKIA is the prefix of long-term keys"]

  - id: aws_secret_access_key
    pattern: '(?i)aws.{0,20}?(?:secret|private).{0,20}?[=:]\s*["'']?([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'
    group: 1
    examples:
      match: ["aws_secret_access_key = {{fake:aws_secret_key}}"]
      no_match: ["aws secret keys should be rotated every 90 days"]

  - id: github_pat
    pattern: '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b'
    examples:
      match: ["use token {{fake:github_pat}} for the push"]
      no_match: ["prefixes like ghp_ mark classic personal access tokens"]

  - id: github_fine_grained_pat
    pattern: '\bgithub_pat_[A-Za-z0-9_]{82}\b'
    examples:
      match: ["GH_TOKEN={{fake:github_fine_grained}}"]
      no_match: ["fine-grained tokens start with github_pat_ and are longer"]

  - id: openai_api_key
    pattern: '\bsk-(?!ant-)(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}'
    examples:
      match: ["OPENAI_API_KEY={{fake:openai_key}}"]
      no_match: ["pip install scikit-learn, imported as sk-learn in some docs"]

  - id: anthropic_api_key
    pattern: '\bsk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{32,}'
    examples:
      match: ["x-api-key: {{fake:anthropic_key}}"]
      no_match: ["anthropic keys start with sk-ant-"]

  - id: google_api_key
    pattern: '\bAIza[0-9A-Za-z_-]{35}(?![0-9A-Za-z_-])'
    examples:
      match: ["?key={{fake:google_api_key}}"]
      no_match: ["AIza is how google api keys begin"]

  - id: slack_token
    pattern: '\bxox[abprs]-[0-9A-Za-z-]{10,}'
    examples:
      match: ["SLACK_BOT_TOKEN={{fake:slack_token}}"]
      no_match: ["bot tokens begin with xoxb- followed by ids"]

  - id: slack_webhook
    pattern: 'https://hooks\.slack\.com/services/T[A-Z0-9]{6,}/B[A-Z0-9]{6,}/[A-Za-z0-9]{20,}'
    examples:
      match: ["post alerts to {{fake:slack_webhook}}"]
      no_match: ["see https://api.slack.com/messaging/webhooks for setup"]

  - id: private_key
    pattern: '-----BEGIN[A-Z ]{0,30}PRIVATE KEY-----[\s\S]*?(?:-----END[A-Z ]{0,30}PRIVATE KEY-----|\Z)'
    continuation: '[\s\S]*?-----END[A-Z ]{0,30}PRIVATE KEY-----|[\s\S]*'
    examples:
      match: ["key file:\n{{fake:pem_private_key}}\nthanks"]
      no_match: ["-----BEGIN PUBLIC KEY----- blocks are safe to share"]

  - id: jwt
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
    examples:
      match: ["Authorization: Bearer {{fake:jwt}}"]
      no_match: ["a jwt has three base64url parts separated by dots"]

  - id: huggingface_token
    pattern: '\bhf_[A-Za-z0-9]{34,}\b'
    examples:
      match: ["HF_TOKEN={{fake:hf_token}}"]
      no_match: ["hf_hub_download fetches files from the hub"]

  - id: stripe_live_key
    pattern: '\b(?:sk|rk)_live_[0-9A-Za-z]{24,}\b'
    examples:
      match: ["stripe.api_key = '{{fake:stripe_key}}'"]
      no_match: ["test keys use sk_test_ instead of sk_live_"]

  - id: gitlab_pat
    pattern: '\bglpat-[0-9A-Za-z_-]{20,}'
    examples:
      match: ["CI_TOKEN={{fake:gitlab_pat}}"]
      no_match: ["gitlab personal access tokens begin with glpat-"]

  - id: url_credentials
    pattern: '\b[a-z][a-z0-9+.-]{1,20}://[^\s:/@]{1,64}:([^\s:/@]{3,128})@'
    group: 1
    examples:
      match: ["DATABASE_URL=postgres://admin:{{fake:password}}@db.internal:5432/app"]
      no_match: ["connect to https://example.com:8443/path"]
