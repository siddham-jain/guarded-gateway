# gates for python -m gg.evalgate (C11 §3.9). --live embeds every pair with the production model, asks jev to
# verify the candidates and records both under cassettes/; ci replays that recording against the threshold and
# min_score in config/cache.yaml, so loosening either shows up as a false hit here. embedder and threshold
# below are only the stand-in used when nothing has been recorded.
suite: cache
version: 1.1.0
embedder: {provider: hashing, name: hashing, dim: 256}
threshold: 0.135
gates:
  item_regressions: {mode: gate}                 # a no_hit pair the cache rejected now hits
  precision: {min: 0.98, mode: gate}             # held-out pairs; C8 §8.2 target
  hit_rate: {max_drop: 0.05, mode: gate}
